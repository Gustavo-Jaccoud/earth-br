[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "field-shift-backend"
version = "0.1.0"
description = "Backend do protótipo Field Shift: dados da NASA traduzidos para o produtor do Nordeste"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "sqlmodel>=0.0.16",
    "httpx>=0.27",
    "pandas>=2.0",
    "numpy>=1.26",
    "xarray>=2024.1",
    "h5netcdf>=1.3",
    "shapely>=2.0",
    "pyyaml>=6.0",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.4"]
pipeline = ["requests>=2.31", "harmony-py>=0.4", "earthaccess>=0.9", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
include = ["app*", "pipeline*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
