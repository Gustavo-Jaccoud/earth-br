# Render Blueprint — https://render.com/docs/blueprint-spec
# Em Render: New > Blueprint > escolha este repositório.
services:
  - type: web
    name: earth-br-api
    runtime: python
    plan: free
    buildCommand: pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.12"
      # Usa só os dados da NASA já versionados em data/cache/power (não depende da NASA no ar).
      - key: POWER_LIVE
        value: "0"
      # O disco do plano grátis é apagado a cada reinício: recria a propriedade de demonstração.
      - key: SEED_DEMO
        value: "1"
