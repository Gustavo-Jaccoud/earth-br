# Sentence templates (English). Callers pass numbers already formatted.
# soil_moisture: NASA POWER GWETROOT, the share of saturation in the top metre of soil
# (0% = dry, 100% = saturated). It is NOT a percentage of soil volume.
# {deviation} is always a positive magnitude ("60%" or "15 mm"): the sentence already says "below".
rain.green: "It rained {value} mm in the last {days} days (regional average: {normal} mm). No rainfall alert."
rain.yellow: "It rained {value} mm in the last {days} days, {deviation} below average ({normal} mm). Stay alert: crops may run short of water."
rain.red: "It rained {value} mm in the last {days} days, {deviation} below average ({normal} mm). High risk for crops."
rain.dry_season: "Normally dry period: it rained {value} mm in the last {days} days (average of {normal} mm). No rainfall alert."
soil_moisture.green: "Root-zone soil moisture is at {value} of saturation, within the expected range for this time of year (average of {normal}). No alert."
soil_moisture.yellow: "Root-zone soil moisture is at {value} of saturation, {deviation} below expected (average of {normal}). Stay alert."
soil_moisture.red: "Root-zone soil moisture is at {value} of saturation, {deviation} below expected (average of {normal}). Very dry soil: high risk of water stress."
rotation.verdict: "The best option for this field is {best}, scoring {total} out of 100."
rotation.no_data: "Not enough data to compare the options."
dry_years.year: "In {year}, rainy-season rainfall was {rain}% below normal ({mm} mm)."
dry_years.none: "No year with a rainy season far below normal in this period."
quiz.risk.low: "Low risk ({risk} out of 100): your farm is well prepared for climate events."
quiz.risk.medium: "Medium risk ({risk} out of 100): some points need attention before the next season."
quiz.risk.high: "High risk ({risk} out of 100): a severe drought could cause large losses. See the suggestions below."
quiz.financial: "Estimated average yearly loss from water shortage: R$ {value} on {area} ha of {crop}."
quiz.no_financial: "The financial impact could not be estimated for this crop at this location."
quiz.no_suggestions: "No suggestions for now: keep it up and watch the indicators."
report.unavailable: "Data unavailable at the moment."
report.suitability: "Most suitable crops for this location, rainfed: {items}."
report.title_analysis: "Land analysis — {plot}"
report.title_quiz: "Quick start — {plot}"
