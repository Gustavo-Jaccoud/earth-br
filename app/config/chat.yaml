# Demo assistant (no AI): topics picked by keywords, answers filled with the field's real data.
#
# keywords: English and Portuguese, lowercase, no accents. A plain word matches a whole word;
#   a word ending in * matches by prefix (chuv* -> chuva, chuvoso); several words match in sequence.
#   The topic with most keywords found wins; on a tie, the higher `priority` (default 0), then
#   the one listed first. More specific topics carry a higher priority.
# answer:   template filled with real data ({fields} are documented in app/services/chat.py);
#           null for topics that are plain text.
# fallback: fixed text WITHOUT numbers, used when the data is missing or inconsistent.
# question: suggested question shown as a button in the chat (omit to hide the topic).
generic: >-
  I can only answer about what Earth+br measures for your land: rain, soil moisture,
  temperature, dry years, the crops that suit it, rotation options and your reports.
  Try one of the questions below.

topics:
  - id: rain
    question: How is the rain on my land?
    keywords: [rain*, precipitation, chuv*, chov*]
    answer: "{message} Data up to {date}."
    fallback: >-
      I could not load the rainfall data right now. On the Dashboard, the rain card compares the
      last month of rain with the usual amount for this time of year.
    sources: [NASA POWER]

  - id: soil_moisture
    question: Is my soil dry?
    keywords: [soil, moisture, humid*, wet, dry, water, solo, terra, umidade, umido, molhad*, seco, seca, agua]
    answer: "{message} Data up to {date}."
    fallback: >-
      I could not load the soil moisture data right now. On the Dashboard, the soil moisture card
      shows how wet the root zone is compared with what is normal for the season.
    sources: [NASA POWER]

  - id: temperature
    question: Is it hotter than usual?
    keywords: [temperatur*, hot, hotter, heat, warm*, cold, calor, quente, frio]
    answer: >-
      In {month}, the average air temperature was {value} °C, {diff} °C {direction} the usual
      for that month ({normal} °C).
    fallback: >-
      I could not load the temperature data right now. The Land analysis page shows the monthly
      air temperature next to the historical average.
    sources: [NASA POWER]

  - id: risk
    question: Is my land at risk right now?
    priority: 2
    keywords: [risk*, alert*, danger*, warning*, drought*, right now, about my land, my farm, how is my, risco*, perigo*, alerta*, situacao, minha terra, minha lavoura, minha roca]
    answer: >-
      {summary} right now. Rain is {rain_status} and soil moisture is {soil_status}.
      Data up to {date}.
    fallback: >-
      I could not load the indicators right now. The Dashboard shows a red or yellow alert
      whenever rain or soil moisture falls well below what is normal for the season.
    sources: [NASA POWER]

  - id: dry_years
    question: Which were the driest years here?
    priority: 1
    keywords: [drought*, driest, dry year*, worst, seca, secas, estiagem, anos secos, ano seco, pior*]
    answer: "The rainy season here usually runs from {season}. {message}"
    fallback: >-
      I could not load the rainfall history right now. The Land analysis page lists the years
      when the rainy season was far below normal.
    sources: [NASA POWER]

  - id: crops
    question: Which crops suit my land?
    priority: 2
    keywords: [crop*, suit*, grow*, plant*, maize, corn, sorghum, bean*, cowpea, cassava, cultur*, cultiv*, apta*, aptid*, milho, sorgo, feijao, mandioca]
    answer: >-
      For the local climate and soil, without irrigation, the most suitable crops are: {items}.
      Suitability is a model of potential, not a harvest forecast.
    fallback: >-
      I have no crop suitability data for this location. Suitability comes from a global model
      that covers maize, beans, cowpea, sorghum and cassava in Northeast Brazil.
    sources: [FAO GAEZ v4]

  - id: rotation
    question: How does my current crop compare with a rotation?
    priority: 3
    keywords: [rotat*, rotac*, rotacao de culturas, compar*, sequenc*, alternativ*]
    answer: >-
      {verdict} {current} alone scores {current_total} out of 100 and {alternative} scores
      {alternative_total} out of 100. Scores combine water coverage and crop suitability; run a
      Quick start for the full comparison.
    fallback: >-
      I cannot compare rotations for this property yet: it needs a current crop and suitability
      data for the location. The Quick start compares your practice with alternative rotations.
    sources: [NASA POWER, FAO GAEZ v4]

  - id: financial
    priority: 3
    keywords: [money, cost*, lose, loss*, financial*, income, dinheiro, prejuizo*, perd*, custo*, custa*, renda]
    answer: null
    fallback: >-
      Earth+br does not estimate financial losses: there is not enough data to support a
      reliable figure yet. What it can show is how often rain fell short of what your crop
      needs, in the Quick start report and in the Land analysis.

  - id: reports
    question: How do I get a report?
    keywords: [report*, pdf, download*, export*, print*, relatorio*, baixar, imprimir]
    answer: null
    fallback: >-
      Reports are created in two places: the Quick start, after you answer the questions, and
      the Land analysis page, with the Generate report button. Every report is saved under
      My reports, where you can open it again or download it as a PDF.

  - id: sources
    question: Where does the data come from?
    keywords: [data, source*, come from, nasa, satellite*, gaez, fao, reliab*, accura*, trust*, numbers, dados, fonte*, satelite*, confia*, numeros]
    answer: null
    fallback: >-
      Rain, soil moisture and temperature come from NASA POWER, which covers each place day by
      day at a coarse scale, so the values are a regional average and arrive a couple of days
      late. Crop suitability comes from FAO GAEZ, a global model of crop potential. Nothing here
      replaces a soil test or the advice of a local agronomist.

  - id: forecast
    priority: 4
    keywords: [forecast*, weather, tomorrow, next week, previsao, tempo, amanha]
    answer: null
    fallback: >-
      Earth+br does not forecast the weather. It describes what has already been measured on
      your land, compared with what is normal for the season, so you can judge the risk before
      you plant.

  - id: help
    keywords: [help, can you do, what can i ask, how does this work, ajuda, como funciona, o que voce faz, pode fazer, voce pode]
    answer: null
    fallback: >-
      I am a demo assistant with pre-written answers, not an AI. I can tell you about the rain,
      soil moisture and temperature on your land, the driest years, the crops that suit it, how
      your crop compares with a rotation, the possible cost of a dry year, and how to get reports.

  - id: greeting
    keywords: [hello, hi, hey, good morning, good afternoon, good evening, oi, ola, bom dia, boa tarde, boa noite]
    answer: null
    fallback: >-
      Hello! I am the Earth+br demo assistant. Ask me about the rain, the soil, the crops that
      suit your land or your reports.

  - id: thanks
    keywords: [thank*, thanks, obrigad*, valeu]
    answer: null
    fallback: >-
      You are welcome! Ask me anything else about your land.
