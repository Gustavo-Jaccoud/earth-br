# Crop catalogue for Northeast Brazil.
#
# Values are APPROXIMATE, inspired by the FAO-56 crop coefficients (Kc); planting months assume
# a rainy season starting around April and should be reviewed for each sub-region.
# gaez_name: crop name in FAO GAEZ v4 (suitability and attainable yield); null = not covered by
#            GAEZ, so the crop has no suitability score.
# kc:        one coefficient per month of the cycle, starting in planting_month. Twelve values
#            mean a perennial (or year-long) crop, which is not offered as a rotation step.
# category:  grain | legume | root | oilseed | fibre | vegetable | fruit | forage | other
crops:
