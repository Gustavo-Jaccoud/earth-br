# Limiares dos semáforos. Desvio em % em relação à média histórica (2001-2020).
# Desvio <= yellow -> amarelo; <= red -> vermelho; senão verde.
rain:
  window_days: 30
  min_normal_mm: 20          # abaixo disso a média é "seca": usa limiar absoluto em mm
  pct: {yellow: -20, red: -50}
  abs_deficit_mm: {yellow: 10, red: 15}
soil_moisture:
  window_days: 7
  pct: {yellow: -10, red: -25}
min_satellite_years: 5
# Dia com menos chuva que isto conta como dia seco (variável "maior sequência sem chuva").
dry_day_mm: 1.0
# Usar a chuva de satélite (GPM) no semáforo de chuva quando ela cobre a data?
# Desligado: comparado ao NASA POWER em Aquidabã (2015-2023), o GPM IMERG registra muito menos
# chuva de junho a setembro (ex.: junho, 29 mm contra 143 mm), o auge da estação chuvosa do
# leste do Nordeste. O GPM continua disponível como variável separada na análise.
satellite_rain_in_signals: false
